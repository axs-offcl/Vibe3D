name: Build Vibe3D (Windows)

# Compiles the stripped Blender 2.83 LTS source in source/ into Vibe3D.exe.
# Feature-stripping flags are the single source of truth for what we cut;
# keep them in sync with docs/STRIP_LIST.md.
#
# Pipeline notes (verified 2026-09-13, see docs/CI_REPAIR_PLAN.md):
# - apply-branding.py sets OUTPUT_NAME Vibe3D, so the build emits Vibe3D.exe
#   directly; the final step verifies it (blender.exe fallback kept just in
#   case branding changes).
# - apply-msvc-patches.py fixes 2.83-era code for the runner's modern MSVC
#   (e.g. missing <string> in audaspace headers); /wd5287 silences the
#   enum-flag warning class C5287 that /WX promotes to errors.
# - svn.blender.org sits behind Cloudflare and rate-limits shared runner IPs
#   (HTTP 429); fetch-win64-libs.sh is selective, resumable and sentinel-
#   gated, and the rolling cache compounds partial progress across runs.
# - apply-strips.py (Phase 3 Wave 1) removes the animation editors
#   (Dope Sheet / Graph / NLA) from the build; unregistered space types
#   fall back to the 3D Viewport (upstream ED_area_initialize behavior).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Serialize builds: parallel runs stampede svn.blender.org's rate limit and
# chop each other into 429-interrupted rounds (seen across runs #13-#16).
concurrency:
  group: build-vibe3d-windows
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Vibe3D repo
        uses: actions/checkout@v4

      - name: Fetch Blender 2.83 LTS source (shallow)
        shell: bash
        run: |
          if [ ! -d source/.git ]; then
            bash scripts/fetch-blender.sh
          else
            git -C source log -1 --format='%H %d %s'
          fi

      # Portable, self-contained svn (no MSI, no registry, no PATH-snapshot trap).
      # Verified: Apache-Subversion-1.14.5.zip contains bin/svn.exe + all libsvn DLLs.
      - name: Install Subversion (portable)
        shell: pwsh
        run: |
          $zip = "$env:TEMP\svn.zip"
          Invoke-WebRequest -Uri "https://www.visualsvn.com/files/Apache-Subversion-1.14.5.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath "$env:USERPROFILE\svn" -Force
          Add-Content $env:GITHUB_PATH "$env:USERPROFILE\svn\bin"

      # Rolling partial-progress cache: restores the most recent libs tree
      # (even a partial one from a failed run) so each attempt resumes
      # instead of restarting the svn fetch from zero.
      - name: Restore libs cache (rolling)
        uses: actions/cache/restore@v4
        with:
          path: lib/win64_vc15
          key: win64-vc15-r62438
          restore-keys: |
            win64-vc15-r62438-

      - name: Fetch Blender Windows precompiled libs
        shell: bash
        run: |
          # Selective, per-subtree, resumable, sentinel-gated fetch of the
          # r62438 win64_vc15 libraries (2.83-release-era: OCIO v1 API +
          # python/37 — see docs/CI_REPAIR_PLAN.md) that the STRIPPED build
          # actually uses. Hard-won lessons:
          # 1. Peg revision (@REV) required (paths gone at HEAD).
          # 2. svn's exit code lies; sentinel files on disk decide.
          # 3. llvm/ + osl/ + OpenImageDenoise/ + embree/ (~6G, incl. the
          #    llvm/debug 429 magnet) are skipped: WITH_CYCLES=OFF never
          #    references them.
          # 4. Azure runner IPs are a lottery: a fresh IP can pull 8G in one
          #    sitting (probe #2), a burned one gets instant 429s for many
          #    minutes (runs #19). This script fails FAST on a burned IP so
          #    the job re-run draws a fresh one.
          bash scripts/fetch-win64-libs.sh lib

      # Save whatever we have — including a partial tree from a failed
      # fetch — under a unique rolling key. restore-keys above picks the
      # newest one next run. (actions/cache only saves on success, which is
      # exactly what a partial-progress strategy must NOT do.)
      - name: Save libs cache (rolling, always)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: lib/win64_vc15
          key: win64-vc15-r62438-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Pre-flight diagnostics
        shell: bash
        run: |
          echo "=== disk free ==="
          df -h . || true
          echo "=== toolchain ==="
          which cmake cl python svn || true
          cmake --version | head -1 || true
          cl 2>&1 | head -1 || true
          python --version || true
          svn --version -q || true

      - name: Apply Vibe3D branding
        shell: bash
        run: |
          python scripts/apply-branding.py --source-dir source

      # 2.83-era sources/libs vs. the runner's modern MSVC: audaspace
      # <string> includes, /wd5287 flag injection, OIIO vendored-fmt
      # _SECURE_SCL guard (lib-side, re-applied after every cache restore).
      # Idempotent; fails loudly if an upstream anchor goes missing.
      - name: Apply MSVC era-gap patches
        shell: bash
        run: |
          python scripts/apply-msvc-patches.py --source-dir source

      # Phase 3 Wave 1 (see docs/STRIP_LIST.md): remove the animation
      # editors from the build. Registration calls + CMake entries only;
      # animation DATA and the Python API stay fully intact.
      - name: Strip animation editors (Wave 1)
        shell: bash
        run: |
          python scripts/apply-strips.py --source-dir source

      - name: Configure (stripped feature set)
        shell: bash
        run: |
          # OIIO link shims: compile first (mini CMake project — hand-invoking
          # cl from Git-bash mangles /flags into MSYS paths, run #26), then
          # feed the .lib + /ALTERNATENAME flags to the main configure.
          cmake -S scripts/shims -B build/shims -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 || exit 1
          cmake --build build/shims --config Release --parallel || exit 1
          SHIM_LIB="$(pwd -W 2>/dev/null || pwd)/build/shims/Release/oiio_link_shims.lib"
          test -f "$SHIM_LIB" || { echo "::error::shim lib missing: $SHIM_LIB"; exit 1; }
          # /ALTERNATENAME is consulted by the linker only when the primary
          # symbol is unresolved — inert if a future lib exports the real
          # thing (run #25: OIIO 2.1.15 DLL lacks the two VS2019-always-
          # inlined dllimport inline members; MSVC 14.5x emits __imp_ calls).
          # Lightness flags (safe, upstream-supported OFF configs):
          # NDOF = 3D-mouse drivers; INTERNATIONAL = i18n (UI stays
          # English); OPENSUBDIV = GPU subdivider (internal fallback).
          cmake -S source -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_EXE_LINKER_FLAGS="/ALTERNATENAME:__imp_??0string_view@OpenImageIO_v2_1@@QEAA@XZ=vibe3d_oiio_stringview_default_ctor /ALTERNATENAME:__imp_?is_array@TypeDesc@OpenImageIO_v2_1@@QEBA_NXZ=vibe3d_oiio_typedesc_is_array \"$SHIM_LIB\"" \
            -DWITH_CYCLES=OFF \
            -DWITH_BULLET=OFF \
            -DWITH_MOD_FLUID=OFF \
            -DWITH_MOD_OCEANSIM=OFF \
            -DWITH_COMPOSITOR=OFF \
            -DWITH_FREESTYLE=OFF \
            -DWITH_OPENVDB=OFF \
            -DWITH_ALEMBIC=OFF \
            -DWITH_USD=OFF \
            -DWITH_OPENCOLLADA=OFF \
            -DWITH_INPUT_NDOF=OFF \
            -DWITH_INTERNATIONAL=OFF \
            -DWITH_OPENSUBDIV=OFF \
          || {
            echo "::error::CMake configure failed — dumping available logs"
            for f in build/CMakeFiles/CMakeError.log \
                     build/CMakeFiles/CMakeConfigureLog.yaml \
                     build/CMakeFiles/cmake.configure.log; do
              if [ -f "$f" ]; then
                echo "----- $f (last 100 lines) -----"
                tail -n 100 "$f"
              fi
            done
            exit 1
          }

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel

      # apply-branding.py renames the target output at CMake level, so the
      # build emits Vibe3D.exe directly. Keep a blender.exe fallback anyway;
      # fail only if neither artifact exists.
      - name: Verify Vibe3D.exe
        shell: pwsh
        run: |
          $vibe = Get-ChildItem -Path build -Recurse -Filter Vibe3D.exe | Select-Object -First 1
          if ($vibe) {
            Write-Host "OK (branded at build time): $($vibe.FullName)"
            exit 0
          }
          $blender = Get-ChildItem -Path build -Recurse -Filter blender.exe | Select-Object -First 1
          if ($blender) {
            $dest = Join-Path $blender.DirectoryName "Vibe3D.exe"
            Copy-Item $blender.FullName $dest
            Write-Host "OK (copied from blender.exe fallback): $dest"
            exit 0
          }
          throw "Neither Vibe3D.exe nor blender.exe found under build/"

      - name: Upload Vibe3D.exe
        uses: actions/upload-artifact@v4
        with:
          name: Vibe3D-windows-x64
          path: build/**/Vibe3D.exe
