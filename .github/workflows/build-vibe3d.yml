name: Build Vibe3D (Windows)

# Compiles the stripped Blender 2.83 LTS source in source/ into Vibe3D.exe.
# Feature-stripping flags are the single source of truth for what we cut;
# keep them in sync with docs/STRIP_LIST.md.
#
# Pipeline notes (verified 2026-09-13, see docs/CI_REPAIR_PLAN.md):
# - apply-branding.py sets OUTPUT_NAME Vibe3D, so the build emits Vibe3D.exe
#   directly; the final step verifies it (blender.exe fallback kept just in
#   case branding changes).
# - apply-msvc-patches.py fixes 2.83-era code for the runner's modern MSVC
#   (e.g. missing <string> in audaspace headers); /wd5287 silences the
#   enum-flag warning class C5287 that /WX promotes to errors.
# - svn.blender.org sits behind Cloudflare and rate-limits shared runner IPs
#   (HTTP 429); fetch-win64-libs.sh is selective, resumable and sentinel-
#   gated, and the rolling cache compounds partial progress across runs.
# - apply-strips.py (Phase 3 Wave 1) removes the animation editors
#   (Dope Sheet / Graph / NLA) from the build; unregistered space types
#   fall back to the 3D Viewport (upstream ED_area_initialize behavior).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Serialize builds: parallel runs stampede svn.blender.org's rate limit and
# chop each other into 429-interrupted rounds (seen across runs #13-#16).
concurrency:
  group: build-vibe3d-windows
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Vibe3D repo
        uses: actions/checkout@v4

      - name: Fetch Blender 2.83 LTS source (shallow)
        shell: bash
        run: |
          if [ ! -d source/.git ]; then
            bash scripts/fetch-blender.sh
          else
            git -C source log -1 --format='%H %d %s'
          fi

      # release/scripts/addons is a git submodule of the Blender repo. Without
      # it the packaged bundle ships an empty addons/ dir and every io_*
      # importer (FBX, glTF, OBJ, ...) fails at startup.
      - name: Init Blender addons submodule
        shell: bash
        run: |
          git -C source submodule update --init --depth 1 release/scripts/addons
          echo "addons: $(ls source/release/scripts/addons | wc -l) entries"

      # Portable, self-contained svn (no MSI, no registry, no PATH-snapshot trap).
      # Verified: Apache-Subversion-1.14.5.zip contains bin/svn.exe + all libsvn DLLs.
      - name: Install Subversion (portable)
        shell: pwsh
        run: |
          $zip = "$env:TEMP\svn.zip"
          Invoke-WebRequest -Uri "https://www.visualsvn.com/files/Apache-Subversion-1.14.5.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath "$env:USERPROFILE\svn" -Force
          Add-Content $env:GITHUB_PATH "$env:USERPROFILE\svn\bin"

      # Rolling partial-progress cache: restores the most recent libs tree
      # (even a partial one from a failed run) so each attempt resumes
      # instead of restarting the svn fetch from zero.
      - name: Restore libs cache (rolling)
        uses: actions/cache/restore@v4
        with:
          path: lib/win64_vc15
          key: win64-vc15-r62438
          restore-keys: |
            win64-vc15-r62438-

      - name: Fetch Blender Windows precompiled libs
        shell: bash
        run: |
          # Selective, per-subtree, resumable, sentinel-gated fetch of the
          # r62438 win64_vc15 libraries (2.83-release-era: OCIO v1 API +
          # python/37 — see docs/CI_REPAIR_PLAN.md) that the STRIPPED build
          # actually uses. Hard-won lessons:
          # 1. Peg revision (@REV) required (paths gone at HEAD).
          # 2. svn's exit code lies; sentinel files on disk decide.
          # 3. llvm/ + osl/ + OpenImageDenoise/ + embree/ (~6G, incl. the
          #    llvm/debug 429 magnet) are skipped: WITH_CYCLES=OFF never
          #    references them.
          # 4. Azure runner IPs are a lottery: a fresh IP can pull 8G in one
          #    sitting (probe #2), a burned one gets instant 429s for many
          #    minutes (runs #19). This script fails FAST on a burned IP so
          #    the job re-run draws a fresh one.
          bash scripts/fetch-win64-libs.sh lib

      # Save whatever we have — including a partial tree from a failed
      # fetch — under a unique rolling key. restore-keys above picks the
      # newest one next run. (actions/cache only saves on success, which is
      # exactly what a partial-progress strategy must NOT do.)
      - name: Save libs cache (rolling, always)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: lib/win64_vc15
          key: win64-vc15-r62438-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Pre-flight diagnostics
        shell: bash
        run: |
          echo "=== disk free ==="
          df -h . || true
          echo "=== toolchain ==="
          which cmake cl python svn || true
          cmake --version | head -1 || true
          cl 2>&1 | head -1 || true
          python --version || true
          svn --version -q || true

      - name: Apply Vibe3D branding
        shell: bash
        run: |
          python scripts/apply-branding.py --source-dir source

      # 2.83-era sources/libs vs. the runner's modern MSVC: audaspace
      # <string> includes, /wd5287 flag injection, OIIO vendored-fmt
      # _SECURE_SCL guard (lib-side, re-applied after every cache restore).
      # Idempotent; fails loudly if an upstream anchor goes missing.
      - name: Apply MSVC era-gap patches
        shell: bash
        run: |
          python scripts/apply-msvc-patches.py --source-dir source

      # Phase 3 (see docs/STRIP_LIST.md): Wave 1 removes the animation
      # editors (Dope Sheet / Graph / NLA); Wave 2 removes sculpt/paint, the
      # sequencer and the clip editor (stub TU satisfies keeper links).
      # Registration calls + CMake entries only; animation DATA and the
      # Python API stay fully intact.
      - name: Strip editor modules (Waves 1+2)
        shell: bash
        run: |
          python scripts/apply-strips.py --source-dir source

      - name: Configure (stripped feature set)
        shell: bash
        run: |
          # OIIO link shims: compile first (mini CMake project — hand-invoking
          # cl from Git-bash mangles /flags into MSYS paths, run #26), then
          # feed the .lib + /ALTERNATENAME flags to the main configure.
          cmake -S scripts/shims -B build/shims -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 || exit 1
          cmake --build build/shims --config Release --parallel || exit 1
          SHIM_LIB="$(pwd -W 2>/dev/null || pwd)/build/shims/Release/oiio_link_shims.lib"
          test -f "$SHIM_LIB" || { echo "::error::shim lib missing: $SHIM_LIB"; exit 1; }
          # /ALTERNATENAME is consulted by the linker only when the primary
          # symbol is unresolved — inert if a future lib exports the real
          # thing (run #25: OIIO 2.1.15 DLL lacks the two VS2019-always-
          # inlined dllimport inline members; MSVC 14.5x emits __imp_ calls).
          # Lightness flags (safe, upstream-supported OFF configs):
          # NDOF = 3D-mouse drivers; INTERNATIONAL = i18n (UI stays
          # English); OPENSUBDIV = GPU subdivider (internal fallback).
          cmake -S source -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_EXE_LINKER_FLAGS="/ALTERNATENAME:__imp_??0string_view@OpenImageIO_v2_1@@QEAA@XZ=vibe3d_oiio_stringview_default_ctor /ALTERNATENAME:__imp_?is_array@TypeDesc@OpenImageIO_v2_1@@QEBA_NXZ=vibe3d_oiio_typedesc_is_array \"$SHIM_LIB\"" \
            -DWITH_CYCLES=OFF \
            -DWITH_BULLET=OFF \
            -DWITH_MOD_FLUID=OFF \
            -DWITH_MOD_OCEANSIM=OFF \
            -DWITH_COMPOSITOR=OFF \
            -DWITH_FREESTYLE=OFF \
            -DWITH_OPENVDB=OFF \
            -DWITH_ALEMBIC=OFF \
            -DWITH_USD=OFF \
            -DWITH_OPENCOLLADA=OFF \
            -DWITH_INPUT_NDOF=OFF \
            -DWITH_INTERNATIONAL=OFF \
            -DWITH_OPENSUBDIV=OFF \
          || {
            echo "::error::CMake configure failed — dumping available logs"
            for f in build/CMakeFiles/CMakeError.log \
                     build/CMakeFiles/CMakeConfigureLog.yaml \
                     build/CMakeFiles/cmake.configure.log; do
              if [ -f "$f" ]; then
                echo "----- $f (last 100 lines) -----"
                tail -n 100 "$f"
              fi
            done
            exit 1
          }

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel

      # apply-branding.py renames the target output at CMake level, so the
      # build emits Vibe3D.exe directly. Keep a blender.exe fallback anyway;
      # fail only if neither artifact exists.
      - name: Verify Vibe3D.exe
        shell: pwsh
        run: |
          $vibe = Get-ChildItem -Path build -Recurse -Filter Vibe3D.exe | Select-Object -First 1
          if ($vibe) {
            Write-Host "OK (branded at build time): $($vibe.FullName)"
            exit 0
          }
          $blender = Get-ChildItem -Path build -Recurse -Filter blender.exe | Select-Object -First 1
          if ($blender) {
            $dest = Join-Path $blender.DirectoryName "Vibe3D.exe"
            Copy-Item $blender.FullName $dest
            Write-Host "OK (copied from blender.exe fallback): $dest"
            exit 0
          }
          throw "Neither Vibe3D.exe nor blender.exe found under build/"

      # Package a runnable bundle. A plain build populates bin/Release with
      # ONLY the exe — the 2.83/ data folder comes from install rules that
      # don't run here. Build it manually instead:
      #   2.83/scripts, 2.83/datafiles/colormanagement  <- source/release/*
      #   2.83/python/{bin,lib}                         <- lib/win64_vc15/python/37
      #   dependency DLLs next to the exe               <- dumpbin /DEPENDENTS,
      #      copied from lib/win64_vc15 (recursive; system DLLs skipped)
      # (startup.blend is datatoc-bundled in 2.83 — no file needed.)
      - name: Package portable bundle
        shell: bash
        run: |
          set -e
          EXE=$(find build -name Vibe3D.exe | head -1)
          EXE_DIR=$(dirname "$EXE")
          echo "bundle root: $EXE_DIR"
          mkdir -p "$EXE_DIR/2.83/datafiles"
          cp -r source/release/scripts "$EXE_DIR/2.83/scripts"
          cp -r source/release/datafiles/colormanagement "$EXE_DIR/2.83/datafiles/colormanagement"
          cp -r source/release/datafiles/fonts "$EXE_DIR/2.83/datafiles/fonts"
          # Icon .dat files are loaded from DISK at runtime — without them
          # every session logs "Missing icons: ops.*.dat Unable to load from
          # file" and viewport gizmos render icon-less.
          if [ -d source/release/datafiles/icons ]; then
            cp -r source/release/datafiles/icons "$EXE_DIR/2.83/datafiles/icons"
            echo "  icons: $(find "$EXE_DIR/2.83/datafiles/icons" -name '*.dat' | wc -l) files"
          else
            echo "::warning::source/release/datafiles/icons missing — gizmo icons will be absent"
          fi
          if [ -d lib/win64_vc15/python/37 ]; then
            mkdir -p "$EXE_DIR/2.83/python"
            cp -r lib/win64_vc15/python/37/bin "$EXE_DIR/2.83/python/bin"
            cp -r lib/win64_vc15/python/37/lib "$EXE_DIR/2.83/python/lib"
          else
            echo "::warning::lib/win64_vc15/python/37 missing — python bundle incomplete"
          fi
          # Dependency DLLs: dumpbin lists the exe's imports; copy whichever
          # of them exist somewhere under lib/win64_vc15 (system DLLs simply
          # won't be found there and are skipped).
          dumpbin //DEPENDENTS "$(cygpath -w "$EXE")" > /tmp/dependents.txt || true
          grep -oiE "[A-Za-z0-9_.-]+\.dll" /tmp/dependents.txt | sort -u | while read -r dll; do
            src=$(find lib/win64_vc15 -iname "$dll" -not -path "*/debug/*" | head -1)
            if [ -n "$src" ]; then
              cp "$src" "$EXE_DIR/"
              echo "  bundled dll: $dll <- $src"
            fi
          done
          # The import scan alone misses two second-level deps (DLLs imported
          # by bundled DLLs, not by the exe) and the private CRT assembly the
          # exe's embedded manifest requires (missing blender.crt = the exe
          # fails to START with a side-by-side error on any clean machine).
          for f in swresample-3.dll tbbmalloc.dll; do
            src=$(find lib/win64_vc15 -iname "$f" -not -path "*/debug/*" | head -1)
            if [ -n "$src" ]; then cp "$src" "$EXE_DIR/"; echo "  bundled dll (2nd-level): $f"; else echo "::warning::$f not found in libs"; fi
          done
          mkdir -p "$EXE_DIR/blender.crt"
          cp scripts/blender.crt.manifest "$EXE_DIR/blender.crt/blender.crt.manifest"
          # Source the CRT from the VS Redist folder of the toolset that
          # BUILT the exe (NOT lib/win64_vc15 — the redistributables don't
          # live there; NOT System32 — the runner may have a different
          # version; NOT official Blender's blender.crt — those 2020-era
          # DLLs crash a VS-2022-built binary inside MSVCP140). Run #35
          # shipped an empty blender.crt and failed loader init 0xC0000135.
          # Search every VS 2022 edition (GitHub runners use Enterprise,
          # local installs often BuildTools) plus the vswhere fallback.
          VS_ROOT=$(cygpath -u "${VCINSTALLDIR:-}")
          if [ -z "$VS_ROOT" ]; then
            for ed in Enterprise Professional Community BuildTools; do
              d="/c/Program Files (x86)/Microsoft Visual Studio/2022/$ed/VC"
              [ -d "$d" ] && VS_ROOT="$d" && break
            done
          fi
          if [ -z "$VS_ROOT" ] && [ -f "/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe" ]; then
            VS_ROOT=$(cygpath -u "$("/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe" -latest -property installationPath)/VC")
          fi
          echo "VS_ROOT=$VS_ROOT"
          CRT_SRC=$(find "$VS_ROOT/Redist/MSVC" -maxdepth 3 -type d \( -name "Microsoft.VC143.CRT" -o -name "Microsoft.VC142.CRT" \) -path "*x64*" 2>/dev/null | sort | tail -1)
          OMP_SRC=$(find "$VS_ROOT/Redist/MSVC" -maxdepth 3 -type d \( -iname "Microsoft.VC143.OpenMP" -o -iname "Microsoft.VC142.OpenMP" \) -path "*x64*" 2>/dev/null | sort | tail -1)
          echo "CRT_SRC=$CRT_SRC"; echo "OMP_SRC=$OMP_SRC"
          test -n "$CRT_SRC" && test -f "$CRT_SRC/msvcp140.dll" || { echo "::error::VS Redist CRT not found — bundle would not start"; exit 1; }
          cp "$CRT_SRC"/*.dll "$EXE_DIR/blender.crt/"
          # The exe imports VCOMP140.DLL (OpenMP); official Blender ships it
          # inside blender.crt as well.
          if [ -n "$OMP_SRC" ] && [ -f "$OMP_SRC/vcomp140.dll" ]; then
            cp "$OMP_SRC/vcomp140.dll" "$EXE_DIR/blender.crt/"
          else
            echo "::warning::vcomp140.dll not found — OpenMP-dependent startup may fail"
          fi
          ls "$EXE_DIR/blender.crt/"
          # Patch the bundled Python UI layer for the stripped spaces (the
          # stock bl_ui register() aborts at the first stripped-space class,
          # leaving TOPBAR menus and the io_* importers unregistered).
          python scripts/patch_scripts_bundle.py "$EXE_DIR/2.83/scripts"
          # Portable launcher: keeps user config inside the bundle (BLENDER_USER_CONFIG
          # -> .\config) so stale %APPDATA% prefs from other Blender installs can
          # never crash Vibe3D (the atio6axx.dll AV reported on first user run).
          cp scripts/launch_vibe3d.bat "$EXE_DIR/"
          # Sanity: the bundle must contain the python dll if python was built.
          test -f "$EXE_DIR/python37.dll" || echo "::warning::python37.dll not bundled"
          ZIP="$GITHUB_WORKSPACE/Vibe3D-windows-x64-portable.zip"
          if command -v 7z > /dev/null 2>&1; then
            (cd "$EXE_DIR" && 7z a -tzip "$(cygpath -w "$ZIP")" Vibe3D.exe launch_vibe3d.bat 2.83 blender.crt *.dll > /dev/null)
          else
            pwsh -Command "Compress-Archive -Path '$(cygpath -w "$EXE_DIR")\Vibe3D.exe','$(cygpath -w "$EXE_DIR")\launch_vibe3d.bat','$(cygpath -w "$EXE_DIR")\2.83','$(cygpath -w "$EXE_DIR")\blender.crt' -DestinationPath '$(cygpath -w "$ZIP")' -Force; if (Test-Path '$(cygpath -w "$EXE_DIR")\*.dll') { Compress-Archive -Path '$(cygpath -w "$EXE_DIR")\*.dll' -Update -DestinationPath '$(cygpath -w "$ZIP")' }"
          fi
          test -f "$EXE_DIR/launch_vibe3d.bat" || { echo "::error::launcher missing from bundle"; exit 1; }
          ls -la "$ZIP"

      - name: Upload Vibe3D.exe
        uses: actions/upload-artifact@v4
        with:
          name: Vibe3D-windows-x64
          path: build/**/Vibe3D.exe

      - name: Upload portable bundle (exe + 2.83 data)
        uses: actions/upload-artifact@v4
        with:
          name: Vibe3D-windows-x64-portable
          path: Vibe3D-windows-x64-portable.zip
