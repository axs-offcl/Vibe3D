name: SVN probe (diagnostic)

# Diagnoses runner-side access to svn.blender.org for the win64_vc15 fetch.
# Emits every probe result as ::error:: annotations so the outcome is
# visible via the checks API without authenticated log access.
# Delete once the libs fetch strategy is settled.

on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/ci-probe.yml']

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Vibe3D repo
        uses: actions/checkout@v4

      - name: Install Subversion (portable)
        shell: pwsh
        run: |
          $zip = "$env:TEMP\svn.zip"
          Invoke-WebRequest -Uri "https://www.visualsvn.com/files/Apache-Subversion-1.14.5.zip" -OutFile $zip
          if ($LASTEXITCODE -or -not (Test-Path $zip)) { echo "::error::zip download failed" }
          $size = (Get-Item $zip).Length
          echo "zip size: $size"
          if ($size -lt 1000000) { echo "::error::zip suspiciously small (HTTP error page?)" }
          Expand-Archive -Path $zip -DestinationPath "$env:USERPROFILE\svn" -Force
          Add-Content $env:GITHUB_PATH "$env:USERPROFILE\svn\bin"

      - name: Probe 1 — plain HTTPS HEAD (no svn)
        shell: bash
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://svn.blender.org/svnroot/bf-blender/trunk/lib/win64_vc15/)
          echo "HTTP $code"
          if [ "$code" != "200" ]; then echo "::error::plain HTTPS to svn.blender.org returned $code"; fi

      - name: Probe 2 — svn on PATH? svn info (DEPTH infinity)
        shell: bash
        run: |
          echo "which svn: $(which svn 2>&1 || echo NOT-FOUND)"
          svn --version -q 2>&1 || echo "::error::svn not runnable on PATH"
          out=$(svn info --non-interactive https://svn.blender.org/svnroot/bf-blender/trunk/lib/win64_vc15 2>&1)
          rc=$?
          echo "$out" | head -20
          if [ $rc -ne 0 ]; then echo "::error::svn info failed rc=$rc :: $(echo "$out" | tail -3 | tr '\n' ' ')"; fi

      - name: Probe 2b — svn.exe by absolute path (PATH-independent)
        shell: bash
        run: |
          "$USERPROFILE/svn/bin/svn.exe" --version -q 2>&1 \
            || echo "::error::svn.exe fails even by absolute path (loader/DLL problem?)"

      # NOTE: peg revision (@62700) is REQUIRED — plain -r 62700 resolves
      # paths against HEAD (r63701) where python/37 no longer exists
      # (E160013 path not found, fails in ~1 s). Verified locally 2026-09-13.
      - name: Probe 3 — svn checkout python/37@62700 (peg syntax, ~140 MB)
        shell: bash
        run: |
          URL="https://svn.blender.org/svnroot/bf-blender/trunk/lib/win64_vc15/python/37@62700"
          if out=$(svn checkout -q --non-interactive -r 62700 "$URL" probe_py37 2>&1); then
            echo "checkout OK: $(du -sh probe_py37 | cut -f1)"
          else
            rc=$?
            echo "$out" | tail -5
            echo "::error::svn checkout python/37@62700 failed rc=$rc :: $(echo "$out" | tail -3 | tr '\n' ' ')"
          fi

      # Cloudflare 429s cut long transfers mid-flight (verified locally:
      # ~140 MB bursts then E175002). SVN can RESUME an interrupted checkout:
      # repeating `svn update` in the same wc continues fetching. Measure how
      # many rounds the full win64_vc15 fetch needs on a runner.
      - name: Probe 4 — resumable full checkout win64_vc15@62700 (~22 min budget)
        shell: bash
        run: |
          URL="https://svn.blender.org/svnroot/bf-blender/trunk/lib/win64_vc15@62700"
          round=0
          complete=""
          while [ $round -lt 12 ]; do
            round=$((round+1))
            if [ ! -d win64_vc15/.svn ]; then
              echo "--- round $round: initial checkout ---"
              if out=$(svn checkout -q --non-interactive -r 62700 "$URL" win64_vc15 2>&1); then
                complete=1; echo "round $round: checkout finished clean"; break
              fi
            else
              echo "--- round $round: resuming via svn update ---"
              svn cleanup win64_vc15 2>/dev/null || true
              if out=$(svn update -q --non-interactive -r 62700 win64_vc15 2>&1); then
                complete=1; echo "round $round: update finished clean"; break
              fi
            fi
            rc=$?
            echo "round $round interrupted (rc=$rc): $(echo "$out" | tail -2 | tr '\n' ' ')"
            echo "progress: $(du -sh win64_vc15 2>/dev/null | cut -f1)"
            svn info win64_vc15 2>/dev/null | grep -E 'Revision|URL' || true
            sleep $((30 + RANDOM % 30))
          done
          echo "rounds used: $round"
          echo "final size: $(du -sh win64_vc15 2>/dev/null | cut -f1)"
          if [ -z "$complete" ]; then
            echo "::warning::full checkout incomplete after $round rounds (see sizes above)"
          else
            echo "::notice::full checkout COMPLETE in $round rounds: $(du -sh win64_vc15 | cut -f1)"
          fi
